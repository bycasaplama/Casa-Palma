<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1200px; height: 630px; overflow: hidden; }

body {
  width: 1200px;
  height: 630px;
  background: #EDE8DF;
  font-family: 'Georgia', serif;
  display: flex;
  position: relative;
  overflow: hidden;
}

/* Left blue panel */
.left {
  width: 420px;
  height: 630px;
  background: #002FA7;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

/* Faint ring inside blue panel */
.left::before {
  content: '';
  position: absolute;
  width: 500px; height: 500px;
  border-radius: 50%;
  border: 0.5px solid rgba(255,255,255,0.06);
  top: -100px; left: -150px;
}
.left::after {
  content: '';
  position: absolute;
  width: 300px; height: 300px;
  border-radius: 50%;
  border: 0.5px solid rgba(255,255,255,0.05);
  bottom: -80px; right: -100px;
}

.photo-wrap {
  position: relative;
  width: 210px;
  height: 210px;
  margin-bottom: 28px;
}

.ring1 {
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 1.5px solid rgba(232,114,42,0.5);
}

.ring2 {
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  border: 0.5px solid rgba(255,255,255,0.2);
}

.photo-circle {
  width: 210px;
  height: 210px;
  border-radius: 50%;
  overflow: hidden;
}

.photo-circle img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.brand-name {
  font-family: Georgia, serif;
  font-size: 13px;
  font-weight: normal;
  letter-spacing: 6px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.55);
}

/* Right content panel */
.right {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 60px 64px;
  position: relative;
}

.top-line {
  position: absolute;
  top: 48px; left: 60px; right: 48px;
  height: 0.5px;
  background: linear-gradient(90deg, #C4A882, transparent);
}

.bottom-line {
  position: absolute;
  bottom: 48px; left: 60px; right: 48px;
  height: 0.5px;
  background: linear-gradient(90deg, #C4A882, transparent);
}

.eyebrow {
  font-family: 'Helvetica Neue', sans-serif;
  font-size: 10px;
  font-weight: 300;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: #9A8B78;
  margin-bottom: 28px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.eyebrow::before {
  content: '';
  display: block;
  width: 28px;
  height: 0.5px;
  background: #C4A882;
}

.headline {
  font-family: Georgia, serif;
  font-size: 68px;
  font-weight: normal;
  line-height: 1.0;
  color: #2A2620;
  margin-bottom: 32px;
  letter-spacing: -1px;
}

.headline em {
  font-style: italic;
  color: #002FA7;
}

.tagline {
  font-family: 'Helvetica Neue', sans-serif;
  font-size: 11px;
  font-weight: 300;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #9A8B78;
  margin-bottom: 36px;
}

.cta-row {
  display: flex;
  align-items: center;
  gap: 20px;
}

.cta-box {
  font-family: 'Helvetica Neue', sans-serif;
  font-size: 10px;
  font-weight: 300;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #002FA7;
  border: 0.5px solid rgba(0,47,167,0.4);
  padding: 10px 20px;
}

.ig {
  font-family: 'Helvetica Neue', sans-serif;
  font-size: 10px;
  font-weight: 300;
  letter-spacing: 2px;
  color: #9A8B78;
}

/* Palm watermark right side */
.palm-bg {
  position: absolute;
  right: -20px;
  top: 50%;
  transform: translateY(-50%);
  opacity: 0.05;
}
</style>
</head>
